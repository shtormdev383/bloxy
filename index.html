<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLOXLY — клон в стиле Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1d22;--panel:#25282f;--panel2:#2f333c;--tx:#f2f3f5;--mut:#9aa0ab;--acc:#00b06f;--acc2:#335fff;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceef2;--panel:#fff;--panel2:#e3e6ec;--tx:#1b1d22;--mut:#5d6470}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Nunito,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Baloo 2',sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--panel2);color:var(--tx)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.btn{background:var(--acc);color:#fff;font-weight:700}.btn.blue{background:var(--acc2)}.btn.red{background:var(--red);color:#fff}
input{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:2px solid var(--panel2);background:var(--bg);color:var(--tx)}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--panel2)}
.logo{font-size:26px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;background:var(--acc);display:inline-block;transform:rotate(-12deg);border-radius:5px}
#search{max-width:340px;margin-left:auto}
#side{position:fixed;top:57px;left:0;bottom:0;width:190px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--panel2);display:flex;flex-direction:column;gap:4px}
#side button{text-align:left;background:none;padding:11px 14px;font-weight:700;color:var(--mut)}
#side button.on,#side button:hover{background:var(--panel2);color:var(--tx)}
main{margin-left:190px;padding:22px;max-width:1150px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.me{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.av{width:56px;height:56px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;font:800 22px 'Baloo 2';color:#fff}
.av.sm{width:46px;height:46px;font-size:18px}.av.big{width:130px;height:130px;font-size:56px;border-radius:24px}
.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:#777}.dot.on{background:var(--acc)}.dot.play{background:var(--acc2)}
.fr{flex:none;width:84px;text-align:center;font-size:13px}.fr .av{margin:0 auto 4px}
h2{font-size:22px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.game{background:var(--panel);border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;text-align:left;padding:0}
.game:hover{border-color:var(--acc2)}
.thumb{aspect-ratio:1;display:grid;place-items:center;font-size:54px}
.game div.t{padding:9px 11px 11px}.game b{display:block;font-size:14px}.game small{color:var(--mut)}
.card{background:var(--panel);border-radius:12px;padding:18px;margin-bottom:14px}
.list>div{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--panel2)}
.list>div:last-child{border:0}.list .g{flex:1}.list small{color:var(--mut);display:block}
.pill{background:var(--panel2);border-radius:99px;padding:5px 12px;font-weight:700}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:16px}
#modal.show{display:grid}#mbox{background:var(--panel);border-radius:14px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.colors button{width:36px;height:36px;padding:0;border-radius:50%;border:3px solid transparent}.colors button.on{border-color:var(--tx)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:20;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.on{background:var(--acc2);color:#fff}
.empty{color:var(--mut);padding:14px 0}
@media(max-width:720px){#side{top:auto;width:100%;height:auto;flex-direction:row;border:0;border-top:1px solid var(--panel2);z-index:6;padding:6px;bottom:env(safe-area-inset-bottom,0px)}#side button{flex:1;text-align:center;padding:10px 4px;font-size:13px}main{margin-left:0;padding:14px 14px 90px}#search{display:none}}
</style></head><body>
<header id="top"><div class="logo"><i></i>BLOXLY</div><span class="tl"><button onclick="go('games')">Игры</button><button onclick="go('catalog')">Каталог</button><button onclick="go('st3')">Создать</button><button onclick="go('donate')">Донат</button></span><input id="search" placeholder="Поиск игр" aria-label="Поиск игр"><button id="gear" onclick="go('settings')" aria-label="Настройки" style="background:none;font-size:20px;padding:6px 10px">⚙️</button><div id="acct" style="display:flex;gap:10px;align-items:center"></div></header>
<nav id="side"></nav><main id="main"></main>
<div id="modal"><div id="mbox"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const GAMES=[["🏙️","Город мечты","Ролевая",48200],["🧟","Выживание в зомби","Экшен",31200],["🏎️","Гонки по крышам","Гонки",22900],["🏰","Побег из замка","Приключения",18400],["🍕","Пиццерия тайкун","Тайкун",40100],["🌋","Лава! Беги!","Паркур",67300],["🚀","Космо-битва","Шутер",15600],["🐶","Приют для питомцев","Симулятор",52800],["⚔️","Мечи и драконы","RPG",27700],["🎨","Рисуй и угадывай","Мини-игры",9800],["🏝️","Остров сокровищ","Приключения",12300],["🧱","Строй базу","Песочница",35500]];
const COLORS=["#e5484d","#f76b15","#f5c518","#00b06f","#12a594","#335fff","#8e4ec6","#e93d82"];
const BOTS=[["Мишка_Про",1],["Neo_Builder",2],["Sasha2012",0],["KotikGamer",1],["Dasha_Star",0],["TopSkill",2],["Vanya_X",0],["PixelFox",1]].map((b,i)=>({name:b[0],st:b[1],color:COLORS[(i*3+1)%8],game:b[1]==2?GAMES[(i*5)%12][1]:null}));
let db=JSON.parse((()=>{try{return localStorage.bx}catch(e){}})()||'{"users":{},"s":null}'),page='home',tab='all',q='';
const save=()=>{try{localStorage.bx=JSON.stringify(db)}catch(e){}};
const me=()=>db.users[db.s];
const bot=n=>BOTS.find(b=>b.name==n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function av(name,color,cls='',st){return `<div class="av ${cls}" style="background:${color}">${esc(name[0].toUpperCase())}${st!=null?`<span class="dot ${['','on','play'][st]}"></span>`:''}</div>`}
function stText(b){return b.st==2?'Играет: '+b.game:b.st==1?'В сети':'Не в сети'}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
document.onkeydown=e=>{if(e.key=='Escape')closeM()};
function go(p){page=p;render()}
function authForm(mode){
 modal(`<h2 style="margin-top:0">${mode=='reg'?'Создать аккаунт':'Войти'}</h2>
 <p><input id="u" placeholder="Имя пользователя" maxlength="16" autocomplete="username"></p>
 <p><input id="p" type="password" placeholder="Пароль (от 4 символов)" autocomplete="${mode=='reg'?'new':'current'}-password"></p>
 <p id="err" style="color:var(--red);min-height:20px;margin:0 0 8px"></p>
 <button class="btn" style="width:100%" onclick="auth('${mode}')">${mode=='reg'?'Зарегистрироваться':'Войти'}</button>
 <p style="text-align:center;color:var(--mut)">${mode=='reg'?'Уже есть аккаунт?':'Нет аккаунта?'} <a href="#" onclick="authForm('${mode=='reg'?'in':'reg'}');return false" style="color:var(--acc2)">${mode=='reg'?'Войти':'Создать'}</a></p>`);
 setTimeout(()=>$('#u').focus(),50)}
function auth(mode){
 const u=$('#u').value.trim(),p=$('#p').value,err=t=>$('#err').textContent=t;
 if(mode=='reg'){
  if(u.length<3)return err('Имя — минимум 3 символа');
  if(p.length<4)return err('Пароль — минимум 4 символа');
  if(db.users[u]||bot(u))return err('Это имя уже занято');
  db.users[u]={p,color:COLORS[Math.random()*8|0],robux:100,friends:[],inc:BOTS.slice(0,2).map(b=>b.name).filter(()=>Math.random()<1),out:[],played:[]};
 }else if(!db.users[u]||db.users[u].p!=p)return err('Неверное имя или пароль');
 db.s=u;save();closeM();render();toast('Добро пожаловать, '+u+'!')}
function logout(){db.s=null;save();go('home')}
function needLogin(){authForm('in');toast('Сначала войдите в аккаунт')}
function openGame(i){
 const g=GAMES[i];
 modal(`<div class="thumb" style="background:var(--panel2);border-radius:10px;margin-bottom:14px;font-size:80px;aspect-ratio:16/9">${g[0]}</div>
 <h2 style="margin:0 0 4px">${g[1]}</h2><div style="color:var(--mut)">${g[2]} · 👤 ${g[3].toLocaleString('ru')} играют</div>
 <p style="display:flex;gap:10px"><button class="btn" style="flex:1;font-size:18px" onclick="play(${i})">▶ Играть</button><button onclick="closeM()">Закрыть</button></p>`)}
function play(i){
 if(!me())return closeM(),needLogin();
 const m=me();m.played=[i,...m.played.filter(x=>x!=i)].slice(0,6);m.robux+=5;save();
 modal(`<h2 style="text-align:center">Загрузка «${GAMES[i][1]}»…</h2><div style="height:10px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:18px 0"><div id="bar" style="height:100%;width:0;background:var(--acc);transition:width 1.6s"></div></div><p style="text-align:center;color:var(--mut)">Это демо: настоящая игра здесь не запускается.</p>`);
 setTimeout(()=>$('#bar').style.width='100%',30);
 setTimeout(()=>{closeM();toast('+5 R$ за игру!');render()},1900)}
function gameCard(i){const g=GAMES[i];return `<button class="game" onclick="openGame(${i})"><div class="thumb" style="background:hsl(${i*47} 45% 38%)">${g[0]}</div><div class="t"><b>${g[1]}</b><small>👤 ${g[3].toLocaleString('ru')}</small></div></button>`}
function friendObjs(){return me().friends.map(bot).filter(Boolean)}
function addFriend(n){const m=me();if(!m)return needLogin();
 if(m.friends.includes(n)||m.out.includes(n))return;
 m.out.push(n);save();render();toast('Запрос отправлен: '+n);
 setTimeout(()=>{const u=me();if(!u||!u.out.includes(n))return;u.out=u.out.filter(x=>x!=n);u.friends.push(n);save();render();toast(n+' принял(а) вашу заявку!')},3500)}
function accept(n){const m=me();m.inc=m.inc.filter(x=>x!=n);m.friends.push(n);save();render();toast('Теперь вы друзья с '+n)}
function decline(n){const m=me();m.inc=m.inc.filter(x=>x!=n);save();render()}
function unfriend(n){const m=me();m.friends=m.friends.filter(x=>x!=n);save();render();toast('Удалён из друзей: '+n)}
function joinF(n){const b=bot(n);if(b.st==2)openGame(GAMES.findIndex(g=>g[1]==b.game));else toast(n+' сейчас не в игре')}
function setColor(c){me().color=c;save();render()}
function tabs(){return ['all|Друзья','req|Запросы'+(me().inc.length?' ('+me().inc.length+')':''),'find|Найти людей'].map(t=>{const[k,l]=t.split('|');return `<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${l}</button>`}).join('')}
function view(){
 const m=me();
 if(page=='home'){
  if(!m)return `<div class="card" style="text-align:center;padding:40px 18px"><h1 style="font-size:38px">Играй, строй, дружи</h1><p style="color:var(--mut);max-width:420px;margin:10px auto 18px">Создай аккаунт, чтобы играть, добавлять друзей и менять своего персонажа.</p><button class="btn" onclick="authForm('reg')">Создать аккаунт</button> <button onclick="authForm('in')">Войти</button></div><h2>Популярное</h2><div class="grid">${GAMES.map((_,i)=>gameCard(i)).join('')}</div>`;
  const fr=friendObjs();
  return `<div class="me">${av(db.s,m.color,'',1)}<div><h1 style="font-size:30px">Привет, ${esc(db.s)}!</h1><span class="pill">R$ ${m.robux}</span></div></div>
  <h2>Друзья (${fr.length})</h2>${fr.length?`<div class="row">${fr.map(b=>`<div class="fr" onclick="joinF('${b.name}')" style="cursor:pointer">${av(b.name,b.color,'',b.st)}${esc(b.name)}</div>`).join('')}</div>`:'<div class="empty">Пока нет друзей. Найди их во вкладке «Друзья».</div>'}
  ${m.played.length?`<h2>Продолжить</h2><div class="grid">${m.played.map(gameCard).join('')}</div>`:''}
  <h2>Популярное сейчас</h2><div class="grid">${GAMES.map((_,i)=>gameCard(i)).join('')}</div>`}
 if(page=='games'){const r=GAMES.map((_,i)=>i).filter(i=>(GAMES[i][1]+GAMES[i][2]).toLowerCase().includes(q));
  return `<h2 style="margin-top:0">Все игры</h2>${r.length?`<div class="grid">${r.map(gameCard).join('')}</div>`:'<div class="empty">Ничего не найдено. Попробуй другое слово.</div>'}`}
 if(page=='friends'){
  if(!m)return `<div class="empty">Войди в аккаунт, чтобы увидеть друзей. <button class="btn" onclick="authForm('in')">Войти</button></div>`;
  let h=`<h2 style="margin-top:0">Друзья</h2><div class="tabs">${tabs()}</div><div class="card list">`;
  if(tab=='all'){const fr=friendObjs();h+=fr.length?fr.map(b=>`<div>${av(b.name,b.color,'sm',b.st)}<div class="g"><b>${esc(b.name)}</b><small>${stText(b)}</small></div>${b.st==2?`<button class="btn blue" onclick="joinF('${b.name}')">Присоединиться</button>`:''}<button onclick="openChat('${b.name}')">Чат</button><button onclick="unfriend('${b.name}')">Удалить</button></div>`).join(''):'<div class="empty">Список пуст.</div>'}
  if(tab=='req')h+=(m.inc.length?m.inc.map(n=>{const b=bot(n);return `<div>${av(n,b.color,'sm')}<div class="g"><b>${esc(n)}</b><small>хочет дружить</small></div><button class="btn" onclick="accept('${n}')">Принять</button><button onclick="decline('${n}')">Отклонить</button></div>`}).join(''):'<div class="empty">Новых запросов нет.</div>');
  if(tab=='find'){const r=BOTS.filter(b=>!m.friends.includes(b.name));h+=r.length?r.map(b=>`<div>${av(b.name,b.color,'sm',b.st)}<div class="g"><b>${esc(b.name)}</b><small>${stText(b)}</small></div>${m.out.includes(b.name)?'<span class="pill">Отправлено</span>':`<button class="btn" onclick="addFriend('${b.name}')">Добавить</button>`}</div>`).join(''):'<div class="empty">Ты уже подружился со всеми.</div>'}
  return h+'</div>'}
 if(page=='avatar'){
  if(!m)return `<div class="empty">Войди в аккаунт, чтобы изменить персонажа. <button class="btn" onclick="authForm('in')">Войти</button></div>`;
  return `<h2 style="margin-top:0">Персонаж</h2><div class="card" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">${av(db.s,m.color,'big')}<div><b>Цвет персонажа</b><div class="colors">${COLORS.map(c=>`<button aria-label="Цвет ${c}" class="${m.color==c?'on':''}" style="background:${c}" onclick="setColor('${c}')"></button>`).join('')}</div><span class="pill">R$ ${m.robux}</span></div></div>
  <div class="card"><b>Аккаунт</b><p style="color:var(--mut);margin:6px 0 12px">Данные хранятся только в этом браузере.</p><button class="red btn" onclick="logout()">Выйти</button></div>`}
}
function render(){
 $('#side').innerHTML=[['home','🏠 Главная'],['me','👤 Профиль'],['msgs','💬 Сообщения'],['friends','👥 Друзья'],['avatar','🧍 Аватар'],['inv','🎒 Инвентарь'],['trade','🔄 Трейд'],['groups','🛡️ Группы'],['forums','📋 Форумы'],['online','🌐 Онлайн']].map(([k,l])=>`<button class="${page==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 const m=me();
 $('#acct').innerHTML=m?`<span class="pill">R$ ${m.robux}</span><div onclick="go('avatar')" style="cursor:pointer">${av(db.s,m.color,'sm')}</div>`:`<button onclick="authForm('in')">Войти</button><button class="btn" onclick="authForm('reg')">Регистрация</button>`;
 $('#main').innerHTML=view()}
$('#search').oninput=e=>{q=e.target.value.toLowerCase();page='games';render()};
render();
</script><style>
.thumb{background-image:radial-gradient(circle at 30% 20%,#fff4,transparent 60%);text-shadow:0 6px 14px #0007;font-size:64px}
.itm{flex:none;display:grid;gap:4px;justify-items:center;background:var(--panel);padding:8px;border:2px solid transparent}.itm.on{border-color:var(--acc)}.itm small{color:var(--mut)}
textarea{font:inherit;width:100%;min-height:64px;padding:10px 12px;border-radius:8px;border:2px solid var(--panel2);background:var(--bg);color:var(--tx);resize:vertical}
</style><script>
const SK=['#f2c9a0','#e0a878','#b9774a','#7a4a2b','#ffe0bd'].map(v=>[v,0]),SH=COLORS.map((v,i)=>[v,i<2?0:30]),HT=[['none',0],['cap',20],['crown',80],['phones',50]],FC=[['smile',0],['cool',25],['wow',15]],BG=['#335fff','#00b06f','#8e4ec6','#e5484d','#25282f','#f5c518'].map(v=>[v,0]);
function svg(u){const sk=u.skin||SK[0][0],sh=u.shirt||u.color||SH[0][0],bg=u.bg||BG[0][0];
 const face={smile:'<circle cx="41" cy="45" r="3"/><circle cx="59" cy="45" r="3"/><path d="M40 55q10 9 20 0" stroke="#222" stroke-width="3" fill="none"/>',happy:'<path d="M34 46q7-8 14 0M52 46q7-8 14 0" stroke="#222" stroke-width="3" fill="none"/><path d="M42 56q8 8 16 0" stroke="#222" stroke-width="3" fill="none"/>',cool:'<rect x="34" y="40" width="14" height="9" rx="3"/><rect x="52" y="40" width="14" height="9" rx="3"/><path d="M40 57q10 6 20 0" stroke="#222" stroke-width="3" fill="none"/>',wow:'<circle cx="41" cy="44" r="3.5"/><circle cx="59" cy="44" r="3.5"/><ellipse cx="50" cy="58" rx="5" ry="6"/>'}[u.face||'smile']||'';
 const hat={none:'',tophat:'<rect x="30" y="26" width="40" height="5" fill="#222"/><rect x="36" y="8" width="28" height="20" fill="#222"/>',halo:'<ellipse cx="50" cy="16" rx="18" ry="5" fill="none" stroke="#facc15" stroke-width="3"/>',ears:'<path d="M28 34l4-22 14 14zM72 34l-4-22-14 14z" fill="#f8fafc"/>',cap:'<path d="M26 40a24 22 0 0 1 48 0z" fill="#e5484d"/><rect x="24" y="38" width="38" height="5" rx="2" fill="#b02a2f"/>',crown:'<path d="M28 30l6-16 8 10 8-14 8 14 8-10 6 16z" fill="#f5c518" stroke="#c99a00" stroke-width="2"/>',phones:'<path d="M26 46a24 26 0 0 1 48 0" stroke="#333" stroke-width="5" fill="none"/><rect x="21" y="42" width="9" height="16" rx="4" fill="#335fff"/><rect x="70" y="42" width="9" height="16" rx="4" fill="#335fff"/>'}[u.hat||'none']||'';
 return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;border-radius:inherit"><rect width="100" height="100" fill="${bg}"/><path d="M12 100q0-30 38-30t38 30z" fill="${sh}"/><circle cx="50" cy="46" r="24" fill="${sk}"/><g fill="#222">${face}</g>${hat}</svg>`}
av=function(name,color,cls='',st){const u=db.users[name];return `<div class="av ${cls}" style="background:${color}">${u?svg(u):esc(name[0].toUpperCase())}${st!=null?`<span class="dot ${['','on','play'][st]}"></span>`:''}</div>`};
function pick(c,v,p){const m=me(),k=c+':'+v;m.own=m.own||[];if(p&&!m.own.includes(k)){if(m.robux<p)return toast('Не хватает R$');m.robux-=p;m.own.push(k);toast('Куплено за '+p+' R$')}m[c]=v;save();render()}
function profile(){const m=me(),own=m.own||[];

 +g('Вид',tb([[4,'Острые'],[12,'Средние'],[22,'Круглые'],[30,'Пузыри']].map(([v,l])=>sel('r',v,l)).join(''))+'<p></p>'+tb([['c','Компактно'],['n','Обычно'],['r','Просторно']].map(([v,l])=>sel('dn',v,l)).join(''))+'<p></p>'+tb([['left','Меню слева'],['top','Меню сверху']].map(([v,l])=>sel('mp',v,l)).join(''))+'<p></p>'+tb([[900,'Узкая'],[1150,'Обычная'],[1500,'Широкая']].map(([v,l])=>sel('cw',v,l)).join('')))
 +g('Фон страницы',tb([['none','Однотонный'],['dots','Точки'],['grid','Сетка'],['grad','Градиент']].map(([v,l])=>sel('bg',v,l)).join('')))
 +g('Название сайта',`<input value="${esc(c.sn||'')}" maxlength="20" placeholder="BLOXLY" onchange="cfg('sn',this.value)" aria-label="Название сайта">`)
 +g('Переключатели',tg('an','Анимации')+tg('snd','Звуки в играх')+tg('h3','3D-герой на главной'))
 +g('Экспорт и импорт темы',`<textarea id="cfgj" placeholder="Здесь появится JSON темы. Вставь чужой и нажми «Импорт»."></textarea><p style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="cfgExport()">Экспорт</button><button class="btn" onclick="cfgImport()">Импорт</button></p>`)
 +g('Пресеты и сброс',`<button class="btn" onclick="db.cfg={th:'k17',ac:'#00a2ff',r:3,fs:15};save();applyCfg();render()">Korone 2017</button> <button onclick="cfgReset()">Сбросить всё</button>`)};
// ---- больше кнопок
const qa=()=>`<h2>Быстрые действия</h2><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="const k=Object.keys(GM).map(Number);openGame(k[Math.random()*k.length|0])">🎲 Случайная игра</button><button onclick="go('catalog')">🛍 Каталог</button><button onclick="go('st3')">🧊 Студия</button><button onclick="go('forums')">📋 Форум</button><button onclick="go('groups')">🛡 Группы</button><button onclick="go('settings')">🎨 Оформление</button><button onclick="if(me())daily();else authForm('in')">🎁 Бонус</button></div>`;
function shareG(i){const t=GAMES[i][1]+' — '+location.href;try{navigator.clipboard.writeText(t).then(()=>toast('Ссылка скопирована'),()=>toast(t))}catch(e){toast(t)}}
function pExport(){const m={...me()};delete m.p;const j=JSON.stringify(m);$('#pj').value=j;try{navigator.clipboard.writeText(j).then(()=>toast('Профиль скопирован'),()=>{})}catch(e){}}
function pImport(){try{const o=JSON.parse($('#pj').value),m=me();delete o.p;Object.assign(m,o);save();render();toast('Профиль импортирован')}catch(e){toast('Не удалось прочитать JSON')}}
const PP0=profilePage;profilePage=function(){const h=PP0();return me()?h+`<div class="card"><h3 style="margin:0 0 10px">Резервная копия профиля</h3><textarea id="pj" placeholder="JSON профиля"></textarea><p style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="pExport()">Экспорт</button><button class="btn" onclick="pImport()">Импорт</button><button onclick="shareG(0)">🔗 Ссылка на сайт</button></p></div>`:h};
// ---- живой форум
const FLC=['Все','Общее','Игры','Студия','Трейды','Баги','Идеи','Оффтоп'];let FO={list:[],f:'Все',sort:'new',q:'',open:null,live:0,nc:'Общее',tried:0};
const ago=ts=>{const s=(Date.now()-ts)/1000|0;return s<60?'только что':s<3600?(s/60|0)+' мин назад':s<86400?(s/3600|0)+' ч назад':(s/86400|0)+' дн назад'};
function wsOpen(first){if(WS&&WS.readyState<=1){if(WS.readyState==1)first&&first();else WS.addEventListener('open',()=>first&&first());return}
 try{WS=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){return}const w=WS;w.onopen=()=>first&&first();w.onerror=()=>{};
 w.onclose=()=>{if(WS===w){if(ON.name)toast('Соединение потеряно');ON.name=null;WS=null;FO.live=0;if(page=='online'||page=='forums')render()}};w.onmessage=e=>wsMsg(JSON.parse(e.data))}
wsLogin=function(reg){const n=$('#on').value.trim(),p=$('#op').value;wsOpen(()=>wsSend({t:'login',n,p,reg}));if(!WS)toast('Онлайн работает на размещённом сайте с сервером')};
const WM0=wsMsg;wsMsg=function(m){if(m.t=='ok'&&page=='forums'){Object.assign(ON,{name:m.n,rb:m.rb,fr:m.fr,inc:m.inc});render();return}if(m.t=='forum'){FO.list=m.list;FO.live=1;if(page=='forums')render()}else if(m.t=='fth'){const i=FO.list.findIndex(x=>x.id==m.th.id);if(i>=0){m.th._new=FO.list[i]._new;FO.list[i]=m.th}else{m.th._new=1;FO.list.push(m.th)}fdraw()}else WM0(m)};
function flist(){const q=FO.q.toLowerCase(),L=FO.list.filter(t=>(FO.f=='Все'||t.c==FO.f)&&(!q||(t.t+' '+t.x).toLowerCase().includes(q))),lt=t=>t.r.length?t.r[t.r.length-1][2]:t.ts;
 L.sort(FO.sort=='hot'?(a,b)=>(b.l.length*2+b.r.length)-(a.l.length*2+a.r.length):(a,b)=>lt(b)-lt(a));
 return L.map(t=>`<div style="cursor:pointer" onclick="FO.open=${t.id};render()"><span class="g"><b>${esc(t.t)}</b> ${t._new?'<span class="nw">● Новое</span>':''}<small>${esc(t.c)} · ${esc(t.by)} · ❤ ${t.l.length} · 💬 ${t.r.length} · ${ago(lt(t))}</small></span></div>`).join('')||'<span class="empty">Тем нет. Создай первую!</span>'}
function fview(){const t=FO.list.find(x=>x.id==FO.open);if(!t)return'<span class="empty">Тема не найдена.</span>';t._new=0;
 return `<div class="card"><h3 style="margin:0 0 4px">${esc(t.t)}</h3><small style="color:var(--mut)">${esc(t.by)} · ${esc(t.c)} · ${ago(t.ts)}</small><p>${esc(t.x)}</p><button onclick="lfLike(${t.id})">${ON.name&&t.l.includes(ON.name)?'❤':'🤍'} ${t.l.length}</button></div><div class="card list">${t.r.map(r=>`<div><span class="g"><b>${esc(r[0])}</b> <small style="display:inline">${ago(r[2])}</small><br>${esc(r[1])}</span></div>`).join('')||'<span class="empty">Ответов пока нет.</span>'}</div>`}
function fdraw(){const l=$('#fl');if(l)l.innerHTML=flist();const v=$('#fv');if(v&&FO.open)v.innerHTML=fview()}
const lfLike=id=>ON.name?wsSend({t:'flike',id}):toast('Войди, чтобы ставить лайки');
function lfReply(){const x=$('#frp').value.trim();if(!x)return;wsSend({t:'frep',id:FO.open,x});$('#frp').value=''}
function lfNew(){const title=$('#ft').value.trim(),x=$('#fx').value.trim();if(title.length<3)return toast('Заголовок от 3 символов');wsSend({t:'fnew',c:FO.nc,title,x});$('#ft').value='';$('#fx').value=''}
const FR0=forums;forums=function(){if(!FO.tried){FO.tried=1;wsOpen(()=>wsSend({t:'sub'}))}
 if(!FO.live)return FR0()+`<div class="card"><b>Живой форум</b><p style="margin:6px 0 0;color:var(--mut)">Общий форум для всех посетителей работает на сайте с сервером (инструкция в README). Сейчас показан локальный форум.</p></div>`;
 const login=ON.name?'':`<div class="card" style="max-width:380px"><b>Войди, чтобы писать</b><p></p><input id="on" placeholder="Ник" maxlength="16"><p></p><input id="op" type="password" placeholder="Пароль"><p style="display:flex;gap:8px"><button class="btn" onclick="wsLogin(0)">Войти</button><button onclick="wsLogin(1)">Регистрация</button></p></div>`;
 if(FO.open&&FO.list.some(t=>t.id==FO.open))return `<button onclick="FO.open=null;render()">← К темам</button><div id="fv">${fview()}</div>`+(ON.name?`<p style="display:flex;gap:8px"><input id="frp" maxlength="500" placeholder="Ответ" onkeydown="if(event.key=='Enter')lfReply()"><button class="btn" onclick="lfReply()">Ответить</button></p>`:login);
 return `<h2 style="margin-top:0">Форум <span class="live">● Live</span></h2><div class="tabs" style="flex-wrap:wrap">${FLC.map(c=>`<button class="${FO.f==c?'on':''}" onclick="FO.f='${c}';render()">${c}</button>`).join('')}</div>
 <p style="display:flex;gap:8px;flex-wrap:wrap"><input value="${esc(FO.q)}" placeholder="Поиск по темам" style="max-width:260px" oninput="FO.q=this.value;fdraw()"><button class="${FO.sort=='new'?'btn':''}" onclick="FO.sort='new';render()">Новые</button><button class="${FO.sort=='hot'?'btn':''}" onclick="FO.sort='hot';render()">Популярные</button></p><div class="card list" id="fl">${flist()}</div>`
 +(ON.name?`<div class="card"><h3 style="margin:0 0 8px">Новая тема</h3><select onchange="FO.nc=this.value">${FLC.slice(1).map(c=>`<option ${FO.nc==c?'selected':''}>${c}</option>`).join('')}</select><p></p><input id="ft" maxlength="80" placeholder="Заголовок"><p></p><textarea id="fx" maxlength="1000" placeholder="Текст"></textarea><p><button class="btn" onclick="lfNew()">Опубликовать</button></p></div>`:login)};
const V13=view;view=function(){const r=V13();return page=='home'&&me()?r.replace('<h2',qa()+'<h2'):r};
render();
</script>
</body></html>
